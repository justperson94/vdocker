[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vdocker"
version = "0.5.0"
description = "Visualize Docker objects and their relationships"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Hyunwoo Song", email = "justperson94@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    # vdocker relies on docker-py internals (api.images, ContextAPI),
    # so guard against a breaking major release
    "docker>=7.0,<8",
    "rich>=13.0",
    "click>=8.0",
]

[project.scripts]
vdocker = "vdocker.cli:cli"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-mock", "ruff>=0.5"]
