name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build binary
        run: |
          pip install -e . pyinstaller
          pyinstaller \
            --onefile \
            --name vdocker-linux-amd64 \
            --hidden-import vdocker.formatters.ps \
            --hidden-import vdocker.formatters.images \
            --hidden-import vdocker.formatters.volumes \
            --hidden-import vdocker.formatters.networks \
            --hidden-import vdocker.formatters.tree \
            src/vdocker/cli.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vdocker-linux-amd64
          path: dist/vdocker-linux-amd64

  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build binary
        run: |
          pip install -e . pyinstaller
          pyinstaller \
            --onefile \
            --name vdocker-darwin-amd64 \
            --hidden-import vdocker.formatters.ps \
            --hidden-import vdocker.formatters.images \
            --hidden-import vdocker.formatters.volumes \
            --hidden-import vdocker.formatters.networks \
            --hidden-import vdocker.formatters.tree \
            src/vdocker/cli.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vdocker-darwin-amd64
          path: dist/vdocker-darwin-amd64

  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*/vdocker-*
