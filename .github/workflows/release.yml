name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: vdocker-linux-amd64
          - os: macos-latest
            asset_name: vdocker-darwin-amd64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pyinstaller

      - name: Build binary
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
        run: |
          pyinstaller \
            --onefile \
            --name "$ASSET_NAME" \
            --hidden-import vdocker.formatters.ps \
            --hidden-import vdocker.formatters.images \
            --hidden-import vdocker.formatters.volumes \
            --hidden-import vdocker.formatters.networks \
            --hidden-import vdocker.formatters.tree \
            src/vdocker/cli.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*/vdocker-*
