name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    container:
      image: rockylinux:8

    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        run: |
          dnf install -y python3.11 python3.11-pip python3.11-devel binutils

      - name: Build binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in *[!0-9.]*|"") echo "Invalid tag: $GITHUB_REF_NAME" >&2; exit 1;; esac
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          dnf install -y tar gzip
          python3.11 -m pip install -e . pyinstaller
          python3.11 -m PyInstaller \
            --onedir \
            --copy-metadata vdocker \
            --name vdocker \
            --hidden-import vdocker.formatters.ps \
            --hidden-import vdocker.formatters.images \
            --hidden-import vdocker.formatters.volumes \
            --hidden-import vdocker.formatters.networks \
            --hidden-import vdocker.formatters.ports \
            --hidden-import vdocker.formatters.tree \
            src/vdocker/cli.py
          tar czf vdocker-linux-amd64.tar.gz -C dist vdocker

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vdocker-linux-amd64
          path: vdocker-linux-amd64.tar.gz

  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in *[!0-9.]*|"") echo "Invalid tag: $GITHUB_REF_NAME" >&2; exit 1;; esac
          sed -i '' "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          pip install -e . pyinstaller
          pyinstaller \
            --onedir \
            --copy-metadata vdocker \
            --name vdocker \
            --hidden-import vdocker.formatters.ps \
            --hidden-import vdocker.formatters.images \
            --hidden-import vdocker.formatters.volumes \
            --hidden-import vdocker.formatters.networks \
            --hidden-import vdocker.formatters.ports \
            --hidden-import vdocker.formatters.tree \
            src/vdocker/cli.py
          tar czf vdocker-darwin-amd64.tar.gz -C dist vdocker

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vdocker-darwin-amd64
          path: vdocker-darwin-amd64.tar.gz

  release:
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*/vdocker-*

  update-tap:
    needs: release
    runs-on: ubuntu-latest

    steps:
      - name: Compute checksums and update formula
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          case "$VERSION" in *[!0-9.]*|"") echo "Invalid tag: $GITHUB_REF_NAME" >&2; exit 1;; esac
          REPO="justperson94/vdocker"
          BASE="https://github.com/${REPO}/releases/download/v${VERSION}"

          # Download release archives and compute SHA256
          curl -sL -o vdocker-linux-amd64.tar.gz "${BASE}/vdocker-linux-amd64.tar.gz"
          curl -sL -o vdocker-darwin-amd64.tar.gz "${BASE}/vdocker-darwin-amd64.tar.gz"
          LINUX_SHA=$(sha256sum vdocker-linux-amd64.tar.gz | cut -d' ' -f1)
          DARWIN_SHA=$(sha256sum vdocker-darwin-amd64.tar.gz | cut -d' ' -f1)

          # Clone tap repo
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/justperson94/homebrew-tap.git" tap
          cd tap

          # Regenerate formula
          cat > Formula/vdocker.rb <<EOF
          class Vdocker < Formula
            desc "Visualize Docker objects and their relationships in grouped/tree format"
            homepage "https://github.com/justperson94/vdocker"
            version "${VERSION}"
            license "MIT"

            on_macos do
              url "${BASE}/vdocker-darwin-amd64.tar.gz"
              sha256 "${DARWIN_SHA}"
            end

            on_linux do
              url "${BASE}/vdocker-linux-amd64.tar.gz"
              sha256 "${LINUX_SHA}"
            end

            def install
              libexec.install Dir["*"]
              bin.install_symlink libexec/"vdocker"
            end

            test do
              assert_match "vdocker", shell_output("#{bin}/vdocker --version")
            end
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/vdocker.rb
          git commit -m "Update vdocker formula to v${VERSION}"
          git push origin HEAD
